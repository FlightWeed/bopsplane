<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#110b20">
  <meta name="description" content="Discover more. Continue to see what's next.">
  <title>Ready To See The Real Piper?</title>
  <style>
    :root{color-scheme:dark;--bg:#110b20;--muted:#c9bddb;--lavender:#c6a4ff;--white:#fff}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100svh;display:grid;place-items:center;padding:clamp(24px,5vw,50px);background:radial-gradient(ellipse 75% 50% at 50% 15%,#422469 0%,transparent 75%),linear-gradient(165deg,#1b1030 0%,#100b1d 65%,#0b0914 100%);color:var(--white)}
    body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 80% 84%,rgba(134,78,218,.12),transparent 35%)}
    .card{position:relative;width:min(100%,540px);padding:clamp(36px,7vw,64px) clamp(25px,6vw,54px);text-align:center;border-radius:30px;background:linear-gradient(155deg,rgba(255,255,255,.095),rgba(255,255,255,.025));border:1px solid rgba(255,255,255,.13);box-shadow:0 24px 80px rgba(0,0,0,.25)}
    .sparkle{width:56px;height:56px;margin:0 auto 30px;display:grid;place-items:center;border-radius:18px;background:linear-gradient(140deg,#8e5dd3,#58378d);box-shadow:0 10px 35px rgba(161,98,244,.22)}
    .sparkle svg{width:27px;height:27px}
    .eyebrow{margin:0 0 16px;color:var(--lavender);font-weight:700;font-size:.75rem;letter-spacing:.22em;text-transform:uppercase}
    h1{margin:0 auto;max-width:430px;font-size:clamp(2.4rem,9vw,4rem);line-height:1.07;letter-spacing:-.055em;font-weight:800;text-wrap:balance}
    .accent{color:#d3b8ff}
    .subtitle{margin:22px auto 32px;max-width:340px;color:var(--muted);font-size:1rem;line-height:1.6}
    .button{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:60px;padding:16px 20px;border-radius:16px;background:#eee3ff;color:#281340;font-size:1.05rem;font-weight:800;text-decoration:none;box-shadow:0 8px 28px rgba(157,105,240,.17);transition:transform .2s,background .2s,box-shadow .2s}
    .button:hover{background:#fff;transform:translateY(-2px);box-shadow:0 12px 34px rgba(157,105,240,.25)}
    .button:focus-visible{outline:3px solid #d8b9ff;outline-offset:5px}
    .button svg{width:19px;height:19px;transition:transform .2s}
    .button:hover svg{transform:translateX(3px)}
    .foot{font-size:.75rem;letter-spacing:.02em;color:#9c8eaf;margin:22px 0 0}
    @media(max-width:480px){body{padding:18px}.card{border-radius:25px;padding:42px 26px}.sparkle{margin-bottom:26px}.subtitle{margin-bottom:29px}}
    @media(prefers-reduced-motion:reduce){.button,.button svg{transition:none}}
  </style>
</head>
<body>
  <main class="card">
    <div class="sparkle" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 1.9 7.1L21 11l-7.1 1.9L12 20l-1.9-7.1L3 11l7.1-1.9L12 2Z"/><path d="m19 18 .65 1.35L21 20l-1.35.65L19 22l-.65-1.35L17 20l1.35-.65L19 18Z"/></svg>
    </div>
    <p class="eyebrow">Something special awaits</p>
    <h1>Ready To See The <span class="accent">Real Piper?</span></h1>
    <p class="subtitle">You're one click away. Tap below to continue.</p>
    <a class="button" href="https://discord.gg/bXAN3Bzwx" aria-label="Continue to Discord">Continue <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></a>
    <p class="foot">Opens Discord</p>
  </main>
</body>
</html>
