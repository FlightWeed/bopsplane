<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piper's Files</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

* {
margin: 0;
padding: 0;
box-sizing: border-box;
}

body {
font-family: 'Inter', system-ui, sans-serif;
background: linear-gradient(135deg, #0f0f0f 0%, #1a0000 100%);
color: white;
height: 100vh;
display: flex;
align-items: center;
justify-content: center;
overflow: hidden;
position: relative;
}

.background {
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: url('https://picsum.photos/id/1015/2000/1200') center/cover no-repeat;
opacity: 0.15;
z-index: 1;
}

.container {
text-align: center;
z-index: 2;
max-width: 420px;
padding: 20px;
}

.logo {
width: 90px;
height: 90px;
background: #ff0033;
border-radius: 50%;
margin: 0 auto 20px;
display: flex;
align-items: center;
justify-content: center;
font-size: 36px;
font-weight: 700;
box-shadow: 0 0 30px #ff0033;
}

h1 {
font-size: 2.8rem;
line-height: 1.1;
margin-bottom: 16px;
font-weight: 700;
}

.subtitle {
font-size: 1.25rem;
margin-bottom: 40px;
opacity: 0.9;
line-height: 1.4;
}

.enter-btn {
background: #ff0033;
color: white;
font-size: 1.4rem;
font-weight: 700;
padding: 18px 60px;
border: none;
border-radius: 50px;
cursor: pointer;
box-shadow: 0 10px 30px rgba(255, 0, 51, 0.4);
transition: all 0.3s ease;
width: 100%;
max-width: 320px;
margin: 0 auto;
display: block;
}

.enter-btn:hover {
transform: scale(1.05);
box-shadow: 0 15px 40px rgba(255, 0, 51, 0.6);
}

.warning {
margin-top: 40px;
font-size: 0.9rem;
opacity: 0.7;
}

.glow {
animation: glow 2s infinite alternate;
}

@keyframes glow {
from { text-shadow: 0 0 10px #ff0033; }
to { text-shadow: 0 0 30px #ff0033, 0 0 40px #ff0033; }
}
</style>
</head>
<body>
<div class="background"></div>

<div class="container">
<div class="logo glow">🔥</div>

<h1>ARE YOU READY TO SEE</h1>
<h1 class="glow" style="color: #ff3366;">PIPER'S FILES?</h1>

<p class="subtitle">
Exclusive content. No filters.
Only for those who dare to enter.
</p>

<button onclick="enterNow()" class="enter-btn">
ENTER NOW
</button>

<p class="warning">
18+ • Private Community • Files drop instantly
</p>
</div>

<script>
function enterNow() {
// Replace with your actual Discord invite link
window.location.href = "https://discord.gg/ZgvNrpRBe;
}

// Simple mobile optimization
document.addEventListener('DOMContentLoaded', () => {
if (window.innerWidth < 480) {
document.querySelector('h1').style.fontSize = '2.2rem';
}
});
</script>
</body>
</html>
