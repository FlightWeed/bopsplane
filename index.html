<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#7c3aed">
  <title>Piper's Exclusive Archive</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #7c3aed;
      overscroll-behavior: none;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      min-height: 100dvh;
      overflow: hidden;
    }

    .page-link {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      min-height: 100dvh;
      padding:
        max(20px, env(safe-area-inset-top))
        max(18px, env(safe-area-inset-right))
        max(20px, env(safe-area-inset-bottom))
        max(18px, env(safe-area-inset-left));
      color: inherit;
      text-decoration: none;
      cursor: pointer;
      touch-action: manipulation;
      background: linear-gradient(-45deg, #7c3aed, #ec4899, #3b82f6, #22c55e, #f59e0b);
      background-size: 400% 400%;
      animation: bg 12s ease infinite;
    }

    .container {
      width: min(100%, 430px);
      text-align: center;
    }

    h1 {
      font-size: clamp(2rem, 10vw, 3.2rem);
      line-height: 1.05;
      font-weight: 900;
      letter-spacing: -0.04em;
      margin-bottom: clamp(22px, 7vw, 30px);
      overflow-wrap: anywhere;
      background: linear-gradient(90deg, #ffffff, #ffe066, #ffffff, #ffd6f5);
      background-size: 300% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 4s linear infinite;
    }

    .button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 60px;
      padding: 16px 22px;
      border-radius: 999px;
      background: #ffffff;
      color: #7c3aed;
      font-size: clamp(1rem, 4.5vw, 1.1rem);
      font-weight: 900;
      line-height: 1.2;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .page-link:active .button {
      transform: scale(0.97);
      box-shadow: 0 9px 24px rgba(0, 0, 0, 0.22);
    }

    .page-link:focus-visible {
      outline: 4px solid rgba(255, 255, 255, 0.95);
      outline-offset: -8px;
    }

    @keyframes bg {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes shine {
      to { background-position: 300% center; }
    }

    @media (max-width: 360px) {
      .page-link {
        padding-left: 14px;
        padding-right: 14px;
      }

      h1 {
        font-size: clamp(1.8rem, 10vw, 2.4rem);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .page-link,
      h1 {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <a class="page-link" href="https://discord.gg/DgqktwJ6G" aria-label="Join the Fun">
    <main class="container">
      <h1>Let's see what the rumors are about</h1>
      <div class="button">Join the Official Discord</div>
    </main>
  </a>
</body>
</html>
