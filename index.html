<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101018">
  <title>Loading...</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: Arial, Helvetica, sans-serif; background: #101018; color: #fff; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .wrap { width: min(100%, 340px); text-align: center; }
    .status { font-size: 14px; color: #c8c4d8; margin-bottom: 14px; letter-spacing: .03em; }
    .destination { font-size: 18px; font-weight: 700; margin-bottom: 22px; }
    .track { height: 10px; width: 100%; background: #302d3a; border-radius: 999px; overflow: hidden; }
    .ticker { height: 100%; width: 40%; background: linear-gradient(90deg, #a78bfa, #ec4899); border-radius: inherit; animation: loading 1s ease-in-out forwards; }
    @keyframes loading { from { width: 0; } to { width: 100%; } }
    @media (prefers-reduced-motion: reduce) { .ticker { animation: none; width: 100%; } }
  </style>
  <script>
    setTimeout(function () {
      window.location.replace("https://bopsvids.com");
    }, 1000);
  </script>
</head>
<body>
  <main class="wrap" aria-live="polite">
    <div class="status">Loading...</div>
    <div class="destination">Redirecting...</div>
    <div class="track" role="progressbar" aria-label="Redirect progress"><div class="ticker"></div></div>
  </main>
</body>
</html>
