<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7c3aed">
  <title>Piper's Exclusive Archive</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { min-height: 100%; font-family: Arial, Helvetica, sans-serif; }
    .page-link {
      min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
      padding: 24px; text-align: center;
      background: linear-gradient(-45deg, #7c3aed, #ec4899, #3b82f6, #22c55e, #f59e0b);
      background-size: 400% 400%; animation: bg 12s ease infinite;
    }
    .container { width: min(100%, 430px); }
    h1 {
      font-size: clamp(2rem, 10vw, 3.2rem); line-height: 1.05; font-weight: 900; margin-bottom: 24px;
      background: linear-gradient(90deg, #fff, #ffe066, #fff, #ffd6f5);
      background-size: 300% auto; -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; animation: shine 4s linear infinite;
    }
    p { color: white; font-size: 1rem; margin-bottom: 20px; }
    .button {
      display: flex; align-items: center; justify-content: center; min-height: 60px; width: 100%;
      padding: 16px 22px; border-radius: 999px; background: white; color: #7c3aed;
      font-size: 1.1rem; font-weight: 900; text-decoration: none;
      box-shadow: 0 15px 35px rgba(0,0,0,.25); transition: transform .12s ease;
    }
    .button:active { transform: scale(.97); }
    @keyframes bg { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    @keyframes shine { to { background-position: 300% center; } }
    @media (prefers-reduced-motion: reduce) { .page-link, h1 { animation: none; } }
  </style>
</head>
<body>
  <main class="page-link">
    <div class="container">
      <h1>Are You Ready To See Piper's V!ds?</h1>
      <p>Continue to BopsVids.com</p>
      <a class="button" href="https://bopsvids.com">Continue to BopsVids</a>
    </div>
  </main>
</body>
</html>
