<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pipers Files</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      color: #fff;
      overflow: hidden;
    }

    .container {
      text-align: center;
      padding: 2rem;
      max-width: 600px;
    }

    h1 {
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      font-weight: 700;
      letter-spacing: 0.02em;
      margin-bottom: 2.5rem;
      line-height: 1.3;
      text-shadow: 0 0 40px rgba(255, 255, 255, 0.15);
    }

    .btn {
      display: inline-block;
      padding: 1rem 2.5rem;
      font-size: 1.15rem;
      font-weight: 600;
      color: #0a0a0a;
      background: #fff;
      border: none;
      border-radius: 8px;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      box-shadow: 0 4px 20px rgba(255, 255, 255, 0.15);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(255, 255, 255, 0.25);
      background: #f0f0f0;
    }

    .btn:active {
      transform: translateY(0);
    }

    /* subtle background glow */
    body::before {
      content: '';
      position: fixed;
      top: 50%;
      left: 50%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, transparent 70%);
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: -1;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Are You Ready To See Pipers F!les</h1>
    <a href="https://discord.gg/pXRQrPjdY" class="btn" target="_blank" rel="noopener noreferrer">
      Enter Now
    </a>
  </div>
</body>
</html>
